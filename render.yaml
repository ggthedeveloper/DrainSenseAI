services:
  - type: web
    name: drainsense-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./drainsense.db
      - key: CORS_ORIGINS
        value: "*"
